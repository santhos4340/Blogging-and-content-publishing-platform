server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: blogging-platform-backend
  
  datasource:
    url: ${SUPABASE_DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DATABASE_USERNAME:postgres}
    password: ${SUPABASE_DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Supabase Auth Configuration Parameters
supabase:
  url: ${SUPABASE_URL:https://xyzcompany.supabase.co}
  anon-key: ${SUPABASE_ANON_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummykey}

management:
  endpoints:
    web:
      exposure:
        include: health,info
